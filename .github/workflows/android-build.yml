name: ARCEUS Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ARCEUS ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.5"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mainlineDebug APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleMainlineDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARCEUS-mainlineDebug-APK
          path: src/android/app/build/outputs/apk/mainline/debug/*.apk
          if-no-files-found: error
          retention-days: 7
